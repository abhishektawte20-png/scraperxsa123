<div id="section-entity">

    <select class="input input_select businessEntityNameType" data-disabled-if-dnb-field="">
      <option value="FAMILIAR" selected="selected">Familiar Name</option>
      <option value="FORMER">Former Name</option>
      <option value="LEGAL">Legal Name</option>
      <option value="OTHER">Other Name</option>
      <option value="NATIVE_FORMAL">Native Formal Name</option>
      <option value="NATIVE_FAMILIAR">Native Familiar Name</option>
      <option value="NATIVE_FORMER">Native Former Name</option>
      <option value="NATIVE_LEGAL">Native Legal Name</option>
      <option value="NATIVE_OTHER">Native Other Name</option>
    </select>
  </div>
  <div class="name-variation-row">
    <input type="text" value="Protocol Destination Management Sp" data-defaultvalue="Protocol Destination Management Sp" class="input businessEntityName" data-disabled-if-dnb-field="">
    <select class="input input_select businessEntityNameType" data-disabled-if-dnb-field="">

      <option value="FORMER">Former Name</option>
      <option value="LEGAL" selected="selected">Legal Name</option>
      <option value="OTHER">Other Name</option>
      <option value="NATIVE_FORMAL">Native Formal Name</option>
      <option value="NATIVE_FAMILIAR">Native Familiar Name</option>
      <option value="NATIVE_FORMER">Native Former Name</option>
      <option value="NATIVE_LEGAL">Native Legal Name</option>
      <option value="NATIVE_OTHER">Native Other Name</option>
    </select>
  </div>
  <input type="button" value="Add New Name Variation" class="btn btn_secondary buttonView" id="addNameVariation" data-disabled-if-dnb-field="">
  <input type="button" value="Save" class="btn mr_5" data-test-id="business-entity-name-variations-save-btn" id="saveBusinessEntityNameVariation">
</div>
